<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin | AD-DIBA'I IRMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>

<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <div class="brand">
                <span class="brand-mark">A</span>
                <span>AD-DIBA'I IRMA</span>
            </div>

            <nav class="nav">
                <a class="nav-link active" href="dashboard.html">Dashboard</a>
                <a class="nav-link" href="#sholawat">Sholawat</a>
                <button type="button" class="btn btn-link nav-link text-start" id="logoutBtn">Logout</button>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <div>
                    <h1>AD-DIBA'I IRMA</h1>
                    <small class="text-muted">Admin Panel</small>
                </div>

                <div class="admin-user">
                    <div class="admin-user-badge" id="adminInitial">A</div>
                    <div>
                        <div id="adminName">Admin</div>
                        <small id="adminRole" class="text-muted">Role</small>
                    </div>
                </div>
            </div>

            <div id="dashboardLoading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 mb-0 text-muted">Memuat dashboard...</p>
            </div>

            <div id="dashboardContent" style="display:none;">
                <div class="admin-grid">
                    <div class="admin-card">
                        <div class="label">Total Sholawat Aktif</div>
                        <div class="value" id="totalAktif">0</div>
                    </div>

                    <div class="admin-card">
                        <div class="label">Total Sholawat Nonaktif</div>
                        <div class="value" id="totalNonaktif">N/A</div>
                    </div>

                    <div class="admin-card">
                        <div class="label">Total Sholawat</div>
                        <div class="value" id="totalSholawat">0</div>
                    </div>
                </div>

                <div class="admin-toolbar">
                    <div class="admin-toolbar-actions">
                        <button type="button" class="btn-adiba primary" id="openAddModal">+ Tambah Sholawat</button>
                    </div>

                    <div class="admin-toolbar-actions">
                        <div class="filter-group" id="filterGroup">
                            <button type="button" class="filter-btn active" data-filter="all">Semua</button>
                            <button type="button" class="filter-btn" data-filter="aktif">Aktif</button>
                            <button type="button" class="filter-btn" data-filter="nonaktif">Nonaktif</button>
                        </div>
                    </div>

                    <div class="search-box">
                        <input id="searchInput" type="search" class="form-control"
                            placeholder="Cari judul sholawat..." />
                    </div>
                </div>

                <div class="admin-list" id="sholawatList"></div>
            </div>

            <div id="pageAlert" class="alert d-none mt-3"></div>
        </main>
    </div>

    <div class="modal fade" id="sholawatModal" tabindex="-1" aria-labelledby="sholawatModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="sholawatModalLabel">Tambah Sholawat</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="sholawatForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="judul" class="form-label">Judul</label>
                            <input id="judul" name="judul" type="text" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="teksArab" class="form-label">Teks Arab</label>
                            <textarea id="teksArab" name="teks_arab" class="form-control" rows="4"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="teksLatin" class="form-label">Teks Latin</label>
                            <textarea id="teksLatin" name="teks_latin" class="form-control" rows="4"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="terjemahan" class="form-label">Terjemahan</label>
                            <textarea id="terjemahan" name="terjemahan" class="form-control" rows="4"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="audioFileId" class="form-label">Audio File ID</label>
                            <input id="audioFileId" name="audio_file_id" type="text" class="form-control" />
                        </div>

                        <div class="mb-3" id="statusFieldWrap">
                            <label for="statusField" class="form-label">Status</label>
                            <select id="statusField" name="status" class="form-select">
                                <option value="aktif">Aktif</option>
                                <option value="nonaktif">Nonaktif</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary" id="saveSholawatBtn">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/admin/admin-auth.js"></script>
    <script src="../js/admin/admin-dashboard.js"></script>
    <script src="../js/admin/admin-sholawat.js"></script>
</body>

</html>
