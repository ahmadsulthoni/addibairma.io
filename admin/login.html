<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | AD-DIBA'I IRMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>

<body class="admin-body">
    <div class="container py-5">
        <div class="admin-login-card">
            <div class="brand mb-4">
                <div>
                    <h2>AD-DIBA'I IRMA</h2>
                    <p>Admin Panel</p>
                </div>
            </div>

            <form id="adminLoginForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input id="username" name="username" type="email" class="form-control"
                        placeholder="Masukkan email" autocomplete="email" />
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-shell">
                        <input id="password" name="password" type="password" class="form-control"
                            placeholder="Masukkan password" autocomplete="current-password" />
                        <button type="button" class="password-toggle" id="togglePassword">Tampilkan</button>
                    </div>
                </div>

                <button id="loginSubmit" type="submit" class="btn btn-primary w-100">LOGIN</button>
                <div id="loginAlert" class="alert alert-danger mt-3" hidden></div>
            </form>

            <a class="btn btn-link w-100 mt-3" href="../index.html">Kembali ke Halaman Sholawat</a>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/admin/admin-auth.js"></script>
    <script src="../js/admin/admin-login.js"></script>
</body>

</html>
